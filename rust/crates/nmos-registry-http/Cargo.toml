[package]
name = "nmos-registry-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "The registry's HTTP surface: routers, handlers, middleware and the browsing view."

[dependencies]
nmos-registry-core = { path = "../nmos-registry-core" }
nmos-registry = { path = "../nmos-registry" }
nmos-json = { path = "../nmos-json" }
serde = { workspace = true }
serde_json = { workspace = true }
# The browsing view is the one consumer in the workspace that genuinely needs
# document key order, and `serde_json/preserve_order` is deliberately not
# enabled because it costs 25% on EVERY parse workspace-wide. So this one
# renderer parses into an ordered map locally instead.
indexmap = { workspace = true }
regex = { workspace = true }
axum = { workspace = true }
http = { workspace = true }
bytes = { workspace = true }
# The runtime the WebSocket endpoint lives on: timers for the keepalive ping
# and the rate-limit window, and `select!` for the four-branch loop.
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true }
openssl = "0.10.81"
base64 = "0.23.1"
parking_lot = "0.12"

[dev-dependencies]
serde_json = { workspace = true }
tokio-tungstenite = { workspace = true }
futures-util = { workspace = true }
tower = { workspace = true }
jsonschema = { version = "0.56.0", default-features = false }

[lints]
workspace = true
